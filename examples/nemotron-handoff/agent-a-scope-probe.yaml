version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /lib64, /etc, /proc, /sandbox, /opt/yare-original-checkout]
  read_write: [/dev, /tmp/yare-task]
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies:
  public_probe:
    endpoints:
      - host: example.com
        port: 443
        protocol: tcp
    binaries:
      - path: /usr/local/bin/python3.12
