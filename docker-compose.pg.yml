version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memorypass
      POSTGRES_DB: memorydb
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memorydb"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrator:
    image: python:3.11-slim
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    environment:
      DATABASE_URL: "postgresql+psycopg2://memory:memorypass@postgres:5432/memorydb"
    volumes:
      - ./:/app
    command: >
      bash -lc "
        pip install -r requirements.txt &&
        pip install alembic psycopg2-binary &&
        alembic upgrade head
      "

  memory:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV: "production"
      LOG_LEVEL: "INFO"
      REDIS_URL: "redis://redis:6379/0"
      POSTGRES_URL: "postgresql+psycopg2://memory:memorypass@postgres:5432/memorydb"
      METRICS_PORT: "9090"
      REQUEST_MAX_BYTES: "10485760"
      RATE_LIMIT_MAX: "120"
      RATE_LIMIT_WINDOW_SEC: "60"
      RATE_LIMIT_IP_MAX: "300"
      RATE_LIMIT_IP_WINDOW_SEC: "60"
      ALLOWED_ORIGINS: "*"
      TRUSTED_HOSTS: "*"
      PROXY_COUNT: "1"
      API_KEYS_FILE: "/run/secrets/api_keys"
      ENCRYPTION_KEY_PATH: "/run/secrets/fernet_key"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      - app-data:/data
    secrets:
      - api_keys
      - fernet_key
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

secrets:
  api_keys:
    file: ./secrets/api_keys.txt
  fernet_key:
    file: ./secrets/fernet.key

volumes:
  app-data:
  redis-data:
  pg-data: