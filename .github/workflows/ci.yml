name: CI

on:
  push:
    branches: [main, nebius-upgrade, codex/nebius-nemotron-upgrade]
  pull_request:

jobs:
  yare-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cli.txt

      - name: Check clean CLI installation
        shell: pwsh
        run: python -m cli.yare doctor

      - name: Install test runner
        shell: pwsh
        run: python -m pip install pytest

      - name: Validate CLI syntax
        shell: pwsh
        run: |
          python -m py_compile cli/yare.py cli/storage.py

      - name: Run supported Yare and producer tests
        shell: pwsh
        run: |
          python -m pytest -q tests/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install site dependencies
        shell: pwsh
        working-directory: site
        run: npm install --ignore-scripts --no-package-lock

      - name: Run site and budget tests
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem tests/site/*.cjs, site/tests/*.test.js | Select-Object -ExpandProperty FullName)
          node --test @testFiles
