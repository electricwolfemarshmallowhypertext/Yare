name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
            python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 mypy bandit safety

      - name: Lint
        run: |
          flake8 src tests
          mypy src

      - name: Test
        run: |
          pytest --maxfail=1 --disable-warnings -q

      - name: Security scan
        run: |
          bandit -r src -q || true
          safety check || true

      - name: Build image
        run: |
          docker build -t memory-service:ci .

      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: memory-service:ci
          format: spdx-json