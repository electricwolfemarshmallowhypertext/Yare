{{- if or (eq .Values.strategy.type "argo-canary") (eq .Values.strategy.type "argo-bluegreen") }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "sticky.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sticky.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sticky.name" . }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
            - containerPort: {{ .Values.service.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "sticky.fullname" . }}-config
  {{- if eq .Values.strategy.type "argo-canary" }}
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {duration: 60}
        - setWeight: 50
        - pause: {duration: 120}
  {{- else }}
  strategy:
    blueGreen:
      activeService: {{ include "sticky.fullname" . }}
      previewService: {{ include "sticky.fullname" . }}-preview
      autoPromotionEnabled: true
  {{- end }}
{{- end }}